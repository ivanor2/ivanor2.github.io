<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои проекты | Ivanor2</title>
    <meta name="yandex-verification" content="c0b34ed1d50f1063" />
    <!-- !!! СЮДА ВСТАВЬТЕ МЕТА-ТЕГ ЯНДЕКС ВЕБМАСТЕРА/МЕТРИКИ ДЛЯ ПОДТВЕРЖДЕНИЯ ПРАВ !!! -->
    <!-- Пример: <meta name="yandex-verification" content="ваш_код_подтверждения" /> -->

    <style>
        /* Базовые стили и сброс */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        /* Контейнер для центрирования контента */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Заголовок страницы */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Сетка для карточек (адаптивная) */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        /* Стиль карточки */
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #eaeaea;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .card p {
            color: #555;
            margin-bottom: 24px;
            flex-grow: 1; /* Чтобы кнопки всегда были прижаты к низу */
        }

        /* Контейнер для кнопок */
        .card-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Стили кнопок */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #007bff;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #f0f2f5;
            color: #333333;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background-color: #e4e6eb;
        }

        /* Адаптив для мобильных устройств */
        @media (max-width: 480px) {
            header h1 {
                font-size: 2rem;
            }
            .card-actions {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Мои проекты</h1>
            <p>Коллекция моих разработок и экспериментов</p>
        </header>

        <main class="projects-grid">
            
            <!-- Карточка проекта 1 -->
            <article class="card">
                <h2>Nextalk Landing</h2>
                <p>
                    Современный лендинг пейдж для проекта Nextalk. 
                    Адаптивный дизайн, оптимизированная структура и интеграция с аналитикой.
                </p>
                <div class="card-actions">
                    <!-- Ссылка на живой сайт -->
                    <a href="https://ivanor2.github.io/nextalk-landing/" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                        Открыть сайт
                    </a>
                    <!-- Ссылка на репозиторий (замените ivanor2/nextalk-landing на реальное имя, если оно отличается) -->
                    <a href="https://github.com/ivanor2/nextalk-landing" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
                        GitHub код
                    </a>
                </div>
            </article>

            <!-- Чтобы добавить новый проект, просто скопируйте блок <article class="card">...</article> и вставьте его сюда -->

        </main>
    </div>

</body>
</html>
